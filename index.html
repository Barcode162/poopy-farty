<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Toot Rocket</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;600;800&display=swap">
<style>
/* Layout: full-screen 3D canvas, HUD floats on top, menus are chunky sticker cards in the middle */
:root {
  --sky: #74c6ff;
  --ink: #2b1838;
  --panel: #ffffff;
  --gas: #8be06a;
  --bean: #c9532f;
  --pop: #ffd23f;
  --muted: #6c5a7a;
  --font-display: "Bungee", "Impact", system-ui, sans-serif;
  --font-body: "Rubik", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--sky); color: var(--ink); font-family: var(--font-body); }
body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
[hidden] { display: none !important; }
canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

.hud { position: fixed; inset: 0 0 auto; display: flex; align-items: flex-start; gap: 14px; pointer-events: none;
  padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: calc(max(16px, env(safe-area-inset-right, 0px)) + 52px); }
.lbl { font-size: 11px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink); opacity: 0.75; }
.num { font-family: var(--font-display); font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--ink); text-shadow: 2px 2px 0 var(--panel); }
.fuel { flex: 1; max-width: 220px; display: grid; gap: 4px; padding-top: 2px; }
.bar { height: 14px; border: 3px solid var(--ink); border-radius: 10px; background: var(--panel); overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; background: var(--gas); transform-origin: left; transition: background 0.2s; }
.bar i.low { background: var(--bean); }

.combo { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 74px); text-align: center; pointer-events: none;
  font-family: var(--font-display); font-size: 22px; color: var(--pop); -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill; }
.toast { position: fixed; left: 0; right: 0; top: 38%; text-align: center; pointer-events: none; opacity: 0;
  font-family: var(--font-display); font-size: clamp(28px, 9vw, 54px); color: var(--panel); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; }
.toast.show { animation: pop 0.9s ease-out forwards; }
@keyframes pop { 0% { opacity: 0; transform: scale(0.4) rotate(-6deg); } 15% { opacity: 1; transform: scale(1.15) rotate(3deg); } 30% { transform: scale(1) rotate(-2deg); } 75% { opacity: 1; } 100% { opacity: 0; transform: translateY(-30px) scale(1); } }

.icon-btn { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); right: max(16px, env(safe-area-inset-right, 0px));
  width: 42px; height: 42px; border-radius: 12px; border: 3px solid var(--ink); background: var(--panel); color: var(--ink);
  font: 800 13px var(--font-body); cursor: pointer; box-shadow: 0 3px 0 var(--ink); }

.panel-wrap { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: safe center; overflow-y: auto; overflow-x: hidden; box-sizing: border-box;
  padding-block: calc(env(safe-area-inset-top, 0px) + 60px) calc(env(safe-area-inset-bottom, 0px) + 24px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.panel { box-sizing: border-box; width: 100%; max-width: 380px; background: var(--panel); border: 4px solid var(--ink); border-radius: 22px; box-shadow: 0 8px 0 var(--ink);
  padding: 22px 20px; display: grid; gap: 14px; text-align: center; transform: rotate(-1deg); }
.title { font-family: var(--font-display); font-size: clamp(34px, 11vw, 48px); line-height: 0.95; margin: 0; color: var(--gas); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-wrap: balance; }
.tag { margin: 0; font-size: 15px; line-height: 1.45; color: var(--muted); }
.btn { font: 400 20px var(--font-display); padding: 14px 16px; border-radius: 16px; border: 3px solid var(--ink); cursor: pointer;
  background: var(--pop); color: var(--ink); box-shadow: 0 5px 0 var(--ink); transition: transform 0.06s; }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.btn.alt { background: var(--panel); font-size: 16px; }
.btn small { display: block; font: 600 12px var(--font-body); letter-spacing: 0.02em; margin-top: 3px; color: var(--muted); }
.btn:focus-visible, .chip:focus-visible, .icon-btn:focus-visible { outline: 3px solid var(--bean); outline-offset: 3px; }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; border: 2px solid var(--ink); background: var(--panel);
  font: 600 13px var(--font-body); color: var(--ink); cursor: pointer; }
.chip .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--ink); }
.chip[aria-pressed="true"] { background: var(--pop); }
.chip:disabled { opacity: 0.45; cursor: not-allowed; }
.big { font-family: var(--font-display); font-size: 56px; line-height: 1; font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats div { display: grid; gap: 2px; }
.stats b { font: 800 20px var(--font-body); font-variant-numeric: tabular-nums; }
.badge { justify-self: center; background: var(--bean); color: var(--panel); font: 800 12px var(--font-body); letter-spacing: 0.1em; text-transform: uppercase; padding: 5px 10px; border-radius: 8px; transform: rotate(2deg); }
.unlock { background: var(--gas); border: 2px dashed var(--ink); border-radius: 12px; padding: 8px; font-weight: 600; font-size: 14px; }
.hint { font-size: 12px; color: var(--muted); margin: 0; }
@media (prefers-reduced-motion: reduce) { .toast.show { animation-duration: 0.01s; opacity: 1; } .panel { transform: none; } }
</style>
</head>
<body>
<canvas id="c" aria-label="Toot Rocket game"></canvas>

<div class="hud" id="hud" hidden>
  <div><div class="lbl">Score</div><div id="score" class="num">0</div></div>
  <div class="fuel"><div class="lbl">Gas</div><div class="bar"><i id="fuel"></i></div></div>
</div>
<div class="combo" id="combo"></div>
<div class="toast" id="toast"></div>
<button class="icon-btn" id="mute" aria-label="Toggle sound">SND</button>

<div class="panel-wrap" id="menu">
  <section class="panel">
    <h1 class="title">TOOT<br>ROCKET</h1>
    <p class="tag">Hold to toot upward. Eat beans for gas. Dodge the pigeons and spikeballs. Don't faceplant the grass.</p>
    <button class="btn" id="play">Play<small id="bestLine">Best: 0</small></button>
    <button class="btn alt" id="daily">Daily run<small id="dailyLine">Same level for everyone today</small></button>
    <div class="lbl">Toot trail</div>
    <div class="chips" id="trails"></div>
    <p class="hint">Tap / hold anywhere, or hold Space</p>
  </section>
</div>

<div class="panel-wrap" id="over" hidden>
  <section class="panel">
    <div class="lbl" id="overMode">Run over</div>
    <h2 class="title" id="overTitle">SPLAT!</h2>
    <div class="badge" id="newBest" hidden>New best!</div>
    <div class="big" id="finalScore">0</div>
    <div class="stats">
      <div><span class="lbl">Beans</span><b id="stBeans">0</b></div>
      <div><span class="lbl">Top combo</span><b id="stCombo">x1</b></div>
      <div><span class="lbl">Best</span><b id="stBest">0</b></div>
    </div>
    <div class="unlock" id="unlockMsg" hidden></div>
    <div class="row">
      <button class="btn" id="again">Again</button>
      <button class="btn alt" id="toMenu">Menu</button>
    </div>
  </section>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const $ = (id) => document.getElementById(id);

// ---------- saved stuff (per device) ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem('toot_' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('toot_' + k, JSON.stringify(v)); } catch {} },
};

// Trails are unlocked by your best score. Earned by playing, never bought.
const TRAILS = [
  { id: 'swamp', name: 'Swamp', color: '#8be06a', need: 0 },
  { id: 'gold', name: 'Gold', color: '#ffd23f', need: 500 },
  { id: 'grape', name: 'Grape', color: '#b07cff', need: 1500 },
  { id: 'rainbow', name: 'Rainbow', color: 'rainbow', need: 3000 },
  { id: 'ghost', name: 'Ghost', color: '#ffffff', need: 6000 },
];

const today = new Date();
const dayKey = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
const daySeed = Number(dayKey.replace(/-/g, ''));

let best = store.get('best', 0);
let dailyBest = store.get('daily_' + dayKey, 0);
let trailId = store.get('trail', 'swamp');
let muted = store.get('muted', false);

function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

// ---------- sound (all synthesized, no files) ----------
let ac = null, master = null, noiseBuf = null;
function ensureAudio() {
  if (!ac) {
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = muted ? 0 : 0.6; master.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch { ac = null; }
  }
  if (ac && ac.state === 'suspended') ac.resume();
}
function sndToot() {
  if (!ac) return;
  const t = ac.currentTime, f = 65 + Math.random() * 55, len = 0.16 + Math.random() * 0.08;
  const o = ac.createOscillator(); o.type = 'sawtooth';
  o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 0.55, t + len);
  const lfo = ac.createOscillator(); lfo.frequency.value = 22 + Math.random() * 20;
  const lg = ac.createGain(); lg.gain.value = f * 0.35; lfo.connect(lg).connect(o.frequency);
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 380 + Math.random() * 200; lp.Q.value = 6;
  const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.4, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
  o.connect(lp).connect(g).connect(master);
  o.start(t); lfo.start(t); o.stop(t + len + 0.02); lfo.stop(t + len + 0.02);
}
function sndBlip(freq) {
  if (!ac) return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = 'square'; o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(freq * 1.5, t + 0.08);
  g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
  o.connect(g).connect(master); o.start(t); o.stop(t + 0.13);
}
function sndSplat() {
  if (!ac) return;
  const t = ac.currentTime, n = ac.createBufferSource(); n.buffer = noiseBuf;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(1200, t); lp.frequency.exponentialRampToValueAtTime(80, t + 0.45);
  const g = ac.createGain(); g.gain.setValueAtTime(0.7, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
  n.connect(lp).connect(g).connect(master); n.start(t); n.stop(t + 0.5);
  const o = ac.createOscillator(), og = ac.createGain(); o.type = 'triangle';
  o.frequency.setValueAtTime(300, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.6);
  og.gain.setValueAtTime(0.3, t); og.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
  o.connect(og).connect(master); o.start(t); o.stop(t + 0.6);
}
function setMuted(m) { muted = m; store.set('muted', m); $('mute').textContent = m ? 'OFF' : 'SND'; if (master) master.gain.value = m ? 0 : 0.6; }
setMuted(muted);

// ---------- 3D scene ----------
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color('#74c6ff');
scene.fog = new THREE.Fog('#74c6ff', 30, 70);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 120);
scene.add(new THREE.HemisphereLight('#ffffff', '#5a8a3a', 1.6));
const sun = new THREE.DirectionalLight('#fff4d6', 1.8); sun.position.set(5, 10, 8); scene.add(sun);

const PLAY_H = 7;          // playable area is y in [-PLAY_H, PLAY_H]
let halfW = 8, camBase = 18;
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  const needH = Math.max(PLAY_H + 0.8, 6.5 / camera.aspect); // always show at least ~6.5 units ahead of center
  camBase = needH / Math.tan(THREE.MathUtils.degToRad(25));
  halfW = needH * camera.aspect;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();

const mat = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.55, ...extra });

// Ground + hills
const ground = new THREE.Mesh(new THREE.BoxGeometry(400, 20, 12), mat('#6bc24a'));
ground.position.set(0, -PLAY_H - 10.6, -3); scene.add(ground);
const dirt = new THREE.Mesh(new THREE.BoxGeometry(400, 0.5, 12.2), mat('#4f9a35'));
dirt.position.set(0, -PLAY_H - 0.85, -3); scene.add(dirt);
const hills = [];
for (let i = 0; i < 10; i++) {
  const r = 4 + Math.random() * 4;
  const hill = new THREE.Mesh(new THREE.SphereGeometry(r, 20, 12), mat(i % 2 ? '#58b04a' : '#4aa043'));
  hill.position.set(-40 + i * 9, -PLAY_H - 1, -14 - Math.random() * 4); hill.scale.y = 0.7;
  scene.add(hill); hills.push(hill);
}
const clouds = [];
for (let i = 0; i < 7; i++) {
  const c = new THREE.Group();
  for (let j = 0; j < 4; j++) {
    const s = new THREE.Mesh(new THREE.SphereGeometry(0.9 + Math.random() * 0.6, 14, 10), mat('#ffffff', { roughness: 1 }));
    s.position.set(j * 1.1 - 1.6, Math.random() * 0.5, Math.random() * 0.4); c.add(s);
  }
  c.position.set(-30 + i * 9 + Math.random() * 3, 1 + Math.random() * 7, -8 - Math.random() * 3);
  scene.add(c); clouds.push(c);
}

// Player: a pink blob with googly eyes (replace with models/player.glb from Blender)
const player = new THREE.Group();
const fallback = new THREE.Group();
const body = new THREE.Mesh(new THREE.SphereGeometry(0.62, 28, 20), mat('#ff8fb8'));
fallback.add(body);
const eyeW = mat('#ffffff', { roughness: 0.2 }), eyeB = mat('#1b1024', { roughness: 0.2 });
for (const [x, y, s] of [[0.18, 0.2, 0.2], [0.42, 0.14, 0.16]]) {
  const e = new THREE.Mesh(new THREE.SphereGeometry(s, 16, 12), eyeW); e.position.set(x, y, 0.5); fallback.add(e);
  const p = new THREE.Mesh(new THREE.SphereGeometry(s * 0.45, 12, 10), eyeB); p.position.set(x + 0.05, y - 0.02, 0.5 + s * 0.8); fallback.add(p);
}
const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.12, 0.035, 8, 16, Math.PI), eyeB);
mouth.position.set(0.36, -0.12, 0.55); mouth.rotation.z = Math.PI; fallback.add(mouth);
const cheekMat = mat('#ff6d9f');
for (const z of [-0.25, 0.25]) { const ch = new THREE.Mesh(new THREE.SphereGeometry(0.32, 16, 12), cheekMat); ch.position.set(-0.45, -0.25, z); fallback.add(ch); }
player.add(fallback); scene.add(player);

// Blender models: drop .glb files in /models with these names and they replace the placeholders.
const models = {};
const loader = new GLTFLoader();
for (const name of ['player', 'bean', 'pigeon', 'spikeball']) {
  loader.load(`models/${name}.glb`, (g) => {
    models[name] = g.scene;
    if (name === 'player') { fallback.visible = false; player.add(g.scene); }
  }, undefined, () => {});
}

const beanGeo = new THREE.CapsuleGeometry(0.2, 0.28, 6, 12), beanMat = mat('#c9532f', { roughness: 0.35 });
function makeBean() {
  if (models.bean) return models.bean.clone();
  const m = new THREE.Mesh(beanGeo, beanMat); m.rotation.z = 1.1; return m;
}
const birdBody = mat('#8f96a8'), birdBeak = mat('#ffa630');
function makePigeon() {
  if (models.pigeon) return models.pigeon.clone();
  const g = new THREE.Group();
  const b = new THREE.Mesh(new THREE.SphereGeometry(0.55, 18, 14), birdBody); b.scale.set(1.25, 0.9, 0.9); g.add(b);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.33, 16, 12), mat('#6d7488')); head.position.set(-0.6, 0.25, 0); g.add(head);
  const beak = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.35, 10), birdBeak); beak.rotation.z = Math.PI / 2; beak.position.set(-0.95, 0.2, 0); g.add(beak);
  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.08, 10, 8), eyeB); eye.position.set(-0.75, 0.35, 0.25); g.add(eye);
  const brow = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.05, 0.05), eyeB); brow.position.set(-0.75, 0.47, 0.27); brow.rotation.z = -0.5; g.add(brow);
  const wing = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.08, 0.7), birdBody); wing.position.set(0.05, 0.3, 0.2); wing.name = 'wing'; g.add(wing);
  return g;
}
const spikeMat = mat('#8a4dd6', { flatShading: true, roughness: 0.4 });
function makeSpikeball() {
  if (models.spikeball) return models.spikeball.clone();
  const g = new THREE.Group();
  g.add(new THREE.Mesh(new THREE.IcosahedronGeometry(0.5, 0), spikeMat));
  const spikeGeo = new THREE.ConeGeometry(0.12, 0.4, 6);
  const dirs = new THREE.IcosahedronGeometry(1, 0).getAttribute('position');
  const seen = new Set();
  for (let i = 0; i < dirs.count; i++) {
    const v = new THREE.Vector3().fromBufferAttribute(dirs, i).normalize(); const k = v.toArray().map((n) => n.toFixed(2)).join();
    if (seen.has(k)) continue; seen.add(k);
    const s = new THREE.Mesh(spikeGeo, spikeMat); s.position.copy(v).multiplyScalar(0.55);
    s.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), v); g.add(s);
  }
  return g;
}

// Toot puffs: a pool of spheres we recycle
const puffs = [];
const puffGeo = new THREE.SphereGeometry(0.3, 12, 10);
for (let i = 0; i < 90; i++) {
  const m = new THREE.Mesh(puffGeo, new THREE.MeshStandardMaterial({ color: '#8be06a', transparent: true, opacity: 0, roughness: 1 }));
  m.visible = false; scene.add(m); puffs.push({ m, life: 0, max: 1, vx: 0, vy: 0 });
}
let puffIdx = 0, hue = 0;
function spawnPuff(x, y, vx, vy, size = 1, color) {
  const p = puffs[puffIdx = (puffIdx + 1) % puffs.length];
  p.m.position.set(x, y, (Math.random() - 0.5) * 0.4); p.vx = vx; p.vy = vy; p.life = p.max = 0.5 + Math.random() * 0.4; p.size = size;
  const t = TRAILS.find((t) => t.id === trailId) || TRAILS[0];
  if (color) p.m.material.color.set(color);
  else if (t.color === 'rainbow') p.m.material.color.setHSL((hue += 0.03) % 1, 0.85, 0.6);
  else p.m.material.color.set(t.color);
  p.m.visible = true;
}

// ---------- game state ----------
let state = 'menu', daily = false, rng = Math.random;
let px = 0, py = 0, vy = 0, holding = false, gas = 100;
let dist = 0, beanPts = 0, beans = 0, combo = 0, topCombo = 1, lastBean = -9, speed = 7, t = 0;
let spawnIn = 4, shake = 0, tootTimer = 0, deadTimer = 0;
const things = [];

function clearThings() { for (const e of things) scene.remove(e.mesh); things.length = 0; }
function add(type, x, y, extra = {}) {
  const mesh = type === 'bean' ? makeBean() : type === 'pigeon' ? makePigeon() : makeSpikeball();
  mesh.position.set(x, y, 0); scene.add(mesh);
  const r = type === 'bean' ? 0.45 : type === 'pigeon' ? 0.6 : 0.62;
  things.push({ type, mesh, x, y, baseY: y, r, phase: rng() * 6.28, passed: false, ...extra });
}

function spawnPattern() {
  const x0 = halfW + 2, level = Math.min(dist / 900, 1), roll = dist < 30 ? 0 : rng();
  if (roll < 0.3 - level * 0.15) { // bean wave
    const c = (rng() - 0.5) * 8, a = 1 + rng() * 2;
    for (let i = 0; i < 7; i++) add('bean', x0 + i * 1.1, c + Math.sin(i * 0.7) * a);
    spawnIn = 9;
  } else if (roll < 0.62) { // pigeon guarding beans
    const y = (rng() - 0.5) * 10, side = y > 0 ? -1 : 1;
    add('pigeon', x0 + 1, y);
    for (let i = 0; i < 3; i++) add('bean', x0 + i * 1.1, y + side * 2);
    if (level > 0.4 && rng() < 0.5) add('pigeon', x0 + 5, (rng() - 0.5) * 10);
    spawnIn = 8 - level * 2;
  } else { // spikeball wall with a gap
    const gap = 4.2 - level * 1.2, center = (rng() - 0.5) * (PLAY_H * 2 - gap - 2);
    for (let y = -PLAY_H + 0.4; y <= PLAY_H; y += 1.25) if (Math.abs(y - center) > gap / 2) add('spikeball', x0, y);
    add('bean', x0, center); add('bean', x0 + 1.3, center);
    spawnIn = 9 - level * 2.5;
  }
}

function toast(msg) {
  const el = $('toast'); el.textContent = msg; el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
}

function startRun(isDaily) {
  ensureAudio();
  daily = isDaily; rng = isDaily ? mulberry32(daySeed) : Math.random;
  clearThings();
  py = 0; vy = 0; gas = 100; dist = 0; beanPts = 0; beans = 0; combo = 0; topCombo = 1; lastBean = -9; speed = 7; spawnIn = 2; shake = 0;
  holding = false; player.visible = true;
  state = 'play';
  $('menu').hidden = true; $('over').hidden = true; $('hud').hidden = false; $('combo').textContent = '';
  toast(isDaily ? 'DAILY RUN!' : 'GO!');
}

function score() { return Math.floor(dist) + beanPts; }
const unlockedBy = (s) => TRAILS.filter((tr) => tr.need <= s);

function die(how) {
  if (state !== 'play') return;
  state = 'dead'; deadTimer = 0.9; holding = false; shake = 0.8; sndSplat();
  for (let i = 0; i < 24; i++) { const a = Math.random() * 6.28; spawnPuff(px, py, Math.cos(a) * 6, Math.sin(a) * 6, 1.6, '#c9532f'); }
  player.visible = false;
  const s = score(), before = unlockedBy(best).length;
  const isBest = s > best; if (isBest) { best = s; store.set('best', best); }
  const isDailyBest = daily && s > dailyBest;
  if (isDailyBest) { dailyBest = s; store.set('daily_' + dayKey, dailyBest); }
  const fresh = unlockedBy(best).slice(before);
  $('overTitle').textContent = how;
  $('overMode').textContent = daily ? `Daily run · ${dayKey}` : 'Run over';
  $('finalScore').textContent = s;
  $('stBeans').textContent = beans; $('stCombo').textContent = 'x' + topCombo; $('stBest').textContent = daily ? dailyBest : best;
  $('newBest').hidden = !(daily ? isDailyBest : isBest);
  const um = $('unlockMsg');
  um.hidden = !fresh.length; if (fresh.length) um.textContent = `Unlocked the ${fresh.map((f) => f.name).join(' + ')} trail!`;
}

function showMenu() {
  state = 'menu'; clearThings(); player.visible = true; py = 0; vy = 0;
  $('over').hidden = true; $('hud').hidden = true; $('menu').hidden = false; $('combo').textContent = '';
  $('bestLine').textContent = `Best: ${best}`;
  $('dailyLine').textContent = dailyBest ? `Today's best: ${dailyBest}` : 'Same level for everyone today';
  const wrap = $('trails'); wrap.innerHTML = '';
  for (const tr of TRAILS) {
    const b = document.createElement('button'); b.className = 'chip'; b.id = 'trail-' + tr.id;
    const open = best >= tr.need;
    b.disabled = !open; b.setAttribute('aria-pressed', String(tr.id === trailId));
    const dot = document.createElement('span'); dot.className = 'dot';
    dot.style.background = tr.color === 'rainbow' ? 'conic-gradient(red, orange, yellow, lime, cyan, blue, magenta, red)' : tr.color;
    b.append(dot, open ? tr.name : `${tr.name} · ${tr.need}`);
    b.onclick = () => { trailId = tr.id; store.set('trail', trailId); showMenu(); };
    wrap.append(b);
  }
}

// ---------- input ----------
const press = () => { if (state === 'play') { ensureAudio(); holding = true; } };
const release = () => { holding = false; };
canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); press(); });
window.addEventListener('pointerup', release); window.addEventListener('pointercancel', release); window.addEventListener('blur', release);
window.addEventListener('keydown', (e) => {
  if (e.code !== 'Space' && e.code !== 'ArrowUp') return; e.preventDefault();
  if (state === 'play') press(); else if (state === 'dead' && deadTimer <= 0) startRun(daily);
});
window.addEventListener('keyup', (e) => { if (e.code === 'Space' || e.code === 'ArrowUp') release(); });
$('play').onclick = () => startRun(false);
$('daily').onclick = () => startRun(true);
$('again').onclick = () => startRun(daily);
$('toMenu').onclick = showMenu;
$('mute').onclick = () => { ensureAudio(); setMuted(!muted); };

// ---------- main loop ----------
const clock = new THREE.Clock();
function update(dt) {
  t += dt;
  px = -halfW * 0.45;
  const scroll = state === 'play' ? speed : state === 'menu' ? 3 : speed * 0.3;

  for (const c of clouds) { c.position.x -= scroll * 0.25 * dt; if (c.position.x < -halfW - 25) c.position.x += 63; }
  for (const h of hills) { h.position.x -= scroll * 0.5 * dt; if (h.position.x < -halfW - 30) h.position.x += 90; }

  if (state === 'menu') {
    py = Math.sin(t * 2) * 0.8; player.position.set(0, py + 1.5, 0); player.rotation.z = Math.sin(t * 2) * 0.15;
    if (Math.random() < 0.3) spawnPuff(-0.6, py + 1.2, -3, -1);
  }

  if (state === 'play') {
    speed = Math.min(7 + dist * 0.01, 15);
    dist += speed * dt;
    const tooting = holding && gas > 0;
    vy += (tooting ? 30 : -24) * dt;
    vy = THREE.MathUtils.clamp(vy, -13, 11);
    py += vy * dt;
    if (tooting) {
      gas = Math.max(0, gas - 26 * dt);
      tootTimer -= dt; if (tootTimer <= 0) { sndToot(); tootTimer = 0.14; }
      spawnPuff(px - 0.6, py - 0.3, -speed * 0.4 - 3, -3 + Math.random() * 2);
    } else {
      gas = Math.min(100, gas + 5 * dt); tootTimer = 0;
    }
    if (py > PLAY_H) { py = PLAY_H; vy = Math.min(vy, -2); }
    if (py < -PLAY_H + 0.1) { py = -PLAY_H + 0.1; die('FACEPLANT!'); }
    player.position.set(px, py, 0);
    player.rotation.z = THREE.MathUtils.lerp(player.rotation.z, vy * 0.04, 0.2);
    const sq = tooting ? 1 + Math.sin(t * 40) * 0.06 : 1; player.scale.set(1 / sq, sq, 1);

    spawnIn -= speed * dt / 1;
    if (spawnIn <= 0) spawnPattern();
    if (t - lastBean > 1.4 && combo > 0) { combo = 0; $('combo').textContent = ''; }
  } else if (state === 'dead') {
    deadTimer -= dt;
    if (deadTimer <= 0 && $('over').hidden) { $('over').hidden = false; $('hud').hidden = true; }
  }

  for (let i = things.length - 1; i >= 0; i--) {
    const e = things[i];
    e.x -= (state === 'play' ? speed : scroll) * dt;
    if (e.type === 'pigeon') { e.x -= 2 * dt; e.y = e.baseY + Math.sin(t * 3 + e.phase) * 0.9; const w = e.mesh.getObjectByName('wing'); if (w) w.rotation.x = Math.sin(t * 22) * 0.7; }
    if (e.type === 'bean') e.mesh.rotation.y += dt * 3;
    if (e.type === 'spikeball') e.mesh.rotation.z += dt * 1.5;
    e.mesh.position.set(e.x, e.y, 0);
    if (state === 'play') {
      const d = Math.hypot(e.x - px, e.y - py);
      if (e.type === 'bean' && d < e.r + 0.55) {
        combo = t - lastBean < 1.4 ? combo + 1 : 1; lastBean = t; beans++;
        const mult = 1 + Math.floor(combo / 3); topCombo = Math.max(topCombo, mult);
        beanPts += 10 * mult; gas = Math.min(100, gas + 16);
        sndBlip(440 + Math.min(combo, 20) * 40);
        for (let k = 0; k < 5; k++) spawnPuff(e.x, e.y, (Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6, 0.5, '#ffd23f');
        $('combo').textContent = combo >= 3 ? `${combo} BEAN COMBO · x${mult}` : '';
        if (combo === 9 || combo === 15 || combo === 25) { toast(combo >= 25 ? 'BEAN LORD!' : combo >= 15 ? 'GASSY!!' : 'BEANTASTIC!'); shake = 0.3; }
        scene.remove(e.mesh); things.splice(i, 1); continue;
      }
      if (e.type !== 'bean') {
        if (d < e.r + 0.48) { die(e.type === 'pigeon' ? 'BONK!' : 'POP!'); }
        else if (!e.passed && e.x < px) { e.passed = true; if (d < e.r + 1.3) { beanPts += 25; toast('CLOSE CALL +25'); } }
      }
    }
    if (e.x < -halfW - 3) { scene.remove(e.mesh); things.splice(i, 1); }
  }

  for (const p of puffs) {
    if (!p.m.visible) continue;
    p.life -= dt; if (p.life <= 0) { p.m.visible = false; continue; }
    const k = 1 - p.life / p.max;
    p.m.position.x += p.vx * dt; p.m.position.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96;
    p.m.scale.setScalar((0.6 + k * 1.6) * (p.size || 1));
    p.m.material.opacity = 0.75 * (1 - k);
  }

  shake = Math.max(0, shake - dt * 1.8);
  camera.position.set((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake, camBase);
  camera.lookAt(0, 0, 0);

  if (state === 'play') {
    $('score').textContent = score();
    const f = $('fuel'); f.style.transform = `scaleX(${gas / 100})`; f.classList.toggle('low', gas < 25);
  }
}

function frame() {
  update(Math.min(clock.getDelta(), 1 / 30));
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
showMenu();
frame();
</script>
</body>
</html>
